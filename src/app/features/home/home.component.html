<div class="home-wrapper">
    <!-- Decorative background elements -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Sidebar Component -->
    <app-sidebar (logout)="logout()"></app-sidebar>

    <!-- Main Section -->
    <main class="main-content">
        <!-- Navbar Component -->
        <app-navbar [userName]="user.name || 'Comandante'"></app-navbar>

        <!-- Content Area -->
        <div class="content-body">
            <div class="mega-glass-card">
                <div class="card-header">
                    <h1 class="welcome-title">Dashboard Operativa</h1>
                    <p class="subtitle">Benvenuto nel centro di gestione</p>
                </div>
            </div>
        </div>
    </main>
</div>
